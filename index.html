<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeckForge</title>
    <script>
      // FOUC guard: set the dark class before CSS loads (mirrors src/lib/theme.ts).
      // Must stay inline and framework-free; failures fall back to light.
      try {
        var stored = localStorage.getItem('deckforge-theme');
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#000000';
        } else {
          document.documentElement.style.backgroundColor = '#FFFFFF';
        }
      } catch (e) {
        /* localStorage/matchMedia unavailable — light theme, no crash */
      }
    </script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
